# Include inside the existing API server block after reviewing its current route.
# Metadata is public and never contains API keys. Do not replace /v1/models.
location = /vsp/models {
    alias /etc/vsp-sub2api/model-catalog.json;
    default_type application/json;
    etag on;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
